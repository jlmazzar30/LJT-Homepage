# Site settings
# These are used to personalize your new site. If you look in the HTML files,
# you will see them accessed via {{ site.title }}, {{ site.email }}, and so on.
# You can create any custom variable you would like, and they will be accessible
# in the templates via {{ site.myvariable }}.

title: "Junteng Liu"
tagline: "Junteng Liu"
description: "Personal homepage of Junteng Liu"
url: "https://jlmazzar30.github.io/LJT-Homepage"
baseurl: "/LJT-Homepage"
repository: "jlmazzar30/LJT-Homepage"
logo: "assets/img/academics-logo.png"

# Social settings
email: "jliugi@connect.ust.hk"
github_username: "Vicent0205"
scholar_link: "https://scholar.google.com/citations?hl=en&user=tbK9jl4AAAAJ&view_op=list_works&sortby=pubdate"
twitter_username: "junteng88716710"

# Build settings
markdown: kramdown
remote_theme: "academicpages/academicpages.github.io"
plugins:
  - jekyll-feed
  - jekyll-gist
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-seo-tag

# Academic Pages settings
# Set to the true domain name if deploying to a custom domain
# url: ""

# Set to the path where your site will be deployed
# baseurl: ""

# If you want to skip footer and navigation, set to false
# This will make the site full screen
search: true

# Collections
collections:
  publications:
    output: true
    permalink: /:collection/:path/

# Defaults
defaults:
  # _publications
  - scope:
      path: ""
      type: publications
    values:
      layout: publication

# Exclude from processing.
# The following items will not be processed, by default.
# Any item listed under the `exclude:` key here will be automatically added to
# the internal "exclude" list used by Jekyll to determine which files to skip
# when generating the site. You can add any files or directories you want to
# exclude from processing here.
exclude:
  - /assets/
  - /vendor/
  - .sass-cache/
  - .jekyll-cache/
  - gemfiles/
  - Gemfile
  - Gemfile.lock
  - node_modules/
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/
